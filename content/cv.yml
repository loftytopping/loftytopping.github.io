pdf: static/David_Topping_CV.pdf

# Short facts shown near the top of the CV page.
highlights:
  - PI or Co-I on research grants totalling more than £30M from UKRI, government and industry
  - Main supervisor of 11 PhD students and co-supervisor of 6
  - More than 130 peer-reviewed journal articles and software papers
  - Original author of open-source atmospheric modelling tools used on every major continent
  - Co-founder and Chief Technology Officer of a University of Manchester spin-out
  - Advisor to UK government and research councils on data and AI in environmental science
# The full publication list lives in content/publications.yml.

summary: |
  I build computational models and digital tools for environmental science, with roots in atmospheric
  and aerosol science and a focus today on machine learning, AI systems, sensing and data infrastructure.
  I have published in journals including Nature, Nature Geoscience and Nature Communications, been PI or
  Co-I on grants totalling more than £30M, edit for two international journals, and co-founded a
  university spin-out. I advise UK government and research councils, including NERC, DEFRA and UKHSA,
  on the use of AI and data science in environmental science, and work with industry partners including NVIDIA.

