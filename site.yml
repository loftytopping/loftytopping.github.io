# One or two short paragraphs for the home page. Markdown is allowed.
intro: |
  I build computational models and digital tools, and I am interested in how a broad range of digital
  technologies, including machine learning, AI systems, sensor networks, data infrastructure and
  high-performance computing, can change the way we understand and manage the environment.

  My background is in atmospheric science. I trained as a physicist and spent the first part of my
  career modelling aerosol particles, and that grounding in process models and real measurements still
  shapes how I approach new problems. My work now spans air quality, urban environments, health and
  environmental data more widely, and I work with government, research councils and industry on how
  these technologies are adopted in practice.

  I am based in the Department of Earth and Environmental Sciences at the University of Manchester.

